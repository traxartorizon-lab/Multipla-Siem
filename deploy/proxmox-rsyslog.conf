# Salve como /etc/rsyslog.d/60-multipla-siem.conf no Proxmox.
# Substitua 192.168.1.20 pelo IP do SIEM. TCP sem TLS: apenas rede de gestão/VPN.
# Se journald não estiver chegando ao rsyslog, verifique imuxsock/imjournal
# na configuração local, evitando carregamento duplicado de módulos.
*.* action(
  type="omfwd"
  target="192.168.1.20"
  port="5514"
  protocol="tcp"
  template="RSYSLOG_TraditionalForwardFormat"
  TCP_Framing="traditional"
  action.resumeRetryCount="-1"
  queue.type="LinkedList"
  queue.filename="multipla-siem-forward"
  queue.maxDiskSpace="256m"
  queue.saveOnShutdown="on"
)
