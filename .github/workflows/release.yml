name: Publish signed Multipla Siem release
on:
  push:
    branches: [main]
    paths: ['release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' https://go.dev/dl/go1.27.2.linux-amd64.tar.gz -o "$RUNNER_TEMP/go.tar.gz"
          echo "ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5  $RUNNER_TEMP/go.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/multipla-go"
          tar -xzf "$RUNNER_TEMP/go.tar.gz" -C "$RUNNER_TEMP/multipla-go"
          echo "$RUNNER_TEMP/multipla-go/go/bin" >> "$GITHUB_PATH"
      - name: Check and build
        env:
          CGO_ENABLED: '0'
          GOTELEMETRY: 'off'
        run: |
          for file in app dashboard device-network critical-controls host-health alert-sounds backup n8n assistant host-chart ssh collectors server-terminal accounts app-update desktop-link mfa native-audio isolation-alerts problem-devices; do node --check "web/$file.js"; done
          node scripts/test-app-update-policy.cjs
          node scripts/test-critical-client-focus.cjs
          node scripts/test-n8n-workflow.cjs
          node scripts/test-reboot-policy.cjs
          node scripts/test-audio-permission.cjs
          node scripts/test-mfa-enrollment.cjs
          bash -n scripts/linux-collector-install.sh
          python3 scripts/test-linux-installer.py
          go test -mod=vendor ./...
          go vet -mod=vendor ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -mod=vendor -buildvcs=false -trimpath -ldflags '-s -w' -o "dist/multipla-siem-linux-$arch" .
            GOOS=linux GOARCH="$arch" go build -mod=vendor -buildvcs=false -trimpath -ldflags '-s -w' -o "dist/multipla-update-linux-$arch" ./cmd/multipla-update
          done
      - name: Verify signatures and exact binary hashes
        run: python3 .github/verify-release.py
      - name: Check nftables inside an isolated network namespace
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables
          sudo unshare --net dist/multipla-siem-linux-amd64 -test-isolation-rules
      - name: Collect verified Linux binaries
        run: |
          mkdir -p linux-package
          cp dist/multipla-siem-linux-* dist/multipla-update-linux-* linux-package/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-linux
          path: linux-package/
          retention-days: 3

  windows-package:
    runs-on: windows-2025
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install verified SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dotnet-sdk.zip'
          Invoke-WebRequest 'https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.402/dotnet-sdk-10.0.402-win-x64.zip' -OutFile $archive
          $expected = 'ae4fd528cb7e9f6af6aaf7de36715a69f761f183744f1bb3025d19f5a92447090ec561410e46266c1d10a63781ed6f3de771760bc76c876d87daabc367b898cd'
          if ((Get-FileHash $archive -Algorithm SHA512).Hash.ToLowerInvariant() -ne $expected) { throw 'SDK integrity failed' }
          $sdk = Join-Path $env:RUNNER_TEMP 'multipla-dotnet'
          Expand-Archive -LiteralPath $archive -DestinationPath $sdk
          $sdk | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Restore, audit, build and self-test
        shell: pwsh
        run: |
          dotnet restore desktop/Multipla.Siem.Desktop.csproj --locked-mode -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Restore/audit failed' }
          dotnet publish desktop/Multipla.Siem.Desktop.csproj -c Release -r win-x64 --self-contained true --no-restore -o app-package
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $app = Join-Path $PWD 'app-package/Multipla.Siem.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--self-test' -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0 -or !(Test-Path app-package/self-test-result.txt)) { throw 'Self-test failed' }
          Get-Content app-package/self-test-result.txt

      - name: Verify and package Windows portable app
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Copy-Item WINDOWS-APP.md app-package/LEIA-ME.md
          Copy-Item desktop/packages.lock.json app-package/dependencies.lock.json
          Remove-Item app-package/self-test-result.txt
          python .github/verify-windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows signature or reproducibility failed' }
          Copy-Item release/windows-manifest.json app-package/
          Copy-Item release/windows-manifest.sig app-package/
          Copy-Item release/trusted-release-public.pem app-package/
          Copy-Item scripts/verify-package.py app-package/
          Compress-Archive -Path app-package/* -DestinationPath "Multipla-SIEM-Windows-$version-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-windows
          path: Multipla-SIEM-Windows-*-x64.zip
          retention-days: 3


  publish:
    needs: [release, windows-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: verified-linux
          path: published/
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: verified-windows
          path: published/
      - name: Assemble source-independent collector bundle and security metadata
        run: |
          python3 .github/package-release.py
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: published/*
      - name: Publish only after both platforms pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version'; exit 1; }
          gh release create "v$version" --target "$GITHUB_SHA" --title "Multipla Siem $version" --notes-file RELEASE-NOTES.md --latest published/*
